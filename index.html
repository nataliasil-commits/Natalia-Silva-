<title>Plaza en Racha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: juego móvil de una columna. Inicio = HUD + tarjeta de Pildi + mapa con un camino dibujado que une monedas-lección; lección = tarjeta de pregunta y hoja de corrección que sube desde abajo. */
:root {
  --bg: #e8f6f0;
  --surface: #ffffff;
  --surface2: #f3faf7;
  --ink: #14302a;
  --muted: #5d786f;
  --line: #d2e6de;
  --mint: #1fc488;
  --sun: #ffbb26;
  --coral: #ff5d55;
  --sky: #3b97ff;
  --tang: #ff8a33;
  --berry: #ea4b93;
  --violet: #8a62f1;
  --ok-bg: #d8f6e8;
  --bad-bg: #ffe2df;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1c1b; --surface: #15302e; --surface2: #1a3836; --ink: #e7f5ef; --muted: #96b3aa; --line: #27494a;
    --mint: #2fd99a; --sun: #ffc93f; --coral: #ff736b; --sky: #5aa9ff; --tang: #ff9d4f; --berry: #f466a8; --violet: #a17ff7;
    --ok-bg: #12382a; --bad-bg: #3e1d1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1c1b; --surface: #15302e; --surface2: #1a3836; --ink: #e7f5ef; --muted: #96b3aa; --line: #27494a;
  --mint: #2fd99a; --sun: #ffc93f; --coral: #ff736b; --sky: #5aa9ff; --tang: #ff9d4f; --berry: #f466a8; --violet: #a17ff7;
  --ok-bg: #12382a; --bad-bg: #3e1d1c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-body); font-weight: 700; font-size: 1rem; line-height: 1.45; color: var(--ink);
  background:
    radial-gradient(circle at 10% -5%, color-mix(in srgb, var(--mint) 22%, transparent), transparent 42%),
    radial-gradient(circle at 105% 25%, color-mix(in srgb, var(--sky) 16%, transparent), transparent 40%),
    radial-gradient(circle at 0% 90%, color-mix(in srgb, var(--sun) 14%, transparent), transparent 40%),
    var(--bg);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.1; text-wrap: balance; font-weight: 800; }
button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 900; color: var(--muted); }
.wrap {
  width: 100%; max-width: 32rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ico { width: 1.3em; height: 1.3em; flex: none; }
.screen { animation: screenIn 0.35s cubic-bezier(.2, .8, .2, 1); }
@keyframes screenIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* Fondo decorativo */
.deco { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
.deco i { position: absolute; color: var(--mint); opacity: 0.13; animation: drift 14s ease-in-out infinite; }
.deco i:nth-child(2n) { color: var(--sky); animation-duration: 18s; }
.deco i:nth-child(3n) { color: var(--sun); animation-duration: 22s; }
.deco svg { width: 100%; height: 100%; }
@keyframes drift { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-26px) rotate(18deg); } }

/* Botones con volumen */
.btn {
  --c: var(--mint);
  position: relative; border: 0; border-radius: 1.1rem; padding: 0.95rem 1.2rem; width: 100%;
  font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: 0.04em; text-transform: uppercase;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c));
  color: #fff; cursor: pointer; text-shadow: 0 1px 0 color-mix(in srgb, var(--c) 60%, #000);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 68%, #000), 0 10px 18px color-mix(in srgb, var(--c) 30%, transparent), inset 0 2px 0 rgba(255, 255, 255, 0.35);
  transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
}
.btn:hover:not(:disabled) { filter: brightness(1.05); }
.btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 68%, #000), inset 0 2px 0 rgba(255, 255, 255, 0.35); }
.btn:disabled { background: var(--line); color: var(--muted); text-shadow: none; cursor: default; box-shadow: 0 6px 0 color-mix(in srgb, var(--line) 78%, #000); }
.btn.ghost { background: var(--surface); color: var(--ink); text-shadow: none; box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px var(--line); }

/* HUD */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: color-mix(in srgb, var(--bg) 78%, transparent); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding-block: 0.6rem; }
.brand { display: flex; align-items: center; gap: 0.4rem; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; line-height: 1; }
.brand .logo { width: 2rem; height: 2rem; border-radius: 0.65rem; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, var(--tang), var(--coral)); box-shadow: 0 3px 0 color-mix(in srgb, var(--coral) 65%, #000); }
.brand .logo .ico { width: 1.2rem; height: 1.2rem; }
.brand small { display: block; white-space: nowrap; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-body); font-weight: 900; }
.hud { display: flex; gap: 0.35rem; align-items: center; }
.pill { display: flex; align-items: center; gap: 0.2rem; font-weight: 900; font-variant-numeric: tabular-nums; background: var(--surface); border: 0; border-radius: 2rem; padding: 0.3rem 0.55rem 0.3rem 0.4rem; box-shadow: 0 2px 0 var(--line); font-size: 0.92rem; }
.pill .ico { width: 1.15rem; height: 1.15rem; }
.pill.flame { color: var(--tang); } .pill.flame.cold { color: var(--muted); }
.pill.gold { color: var(--sun); }
.pill.heart { color: var(--coral); }
.pill.btnlike { cursor: pointer; padding: 0.35rem; color: var(--muted); }
.pill.btnlike.rank { color: var(--sun); }
.bump { animation: bump 0.45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }

/* Mascota */
.mascot { width: 100%; height: 100%; overflow: visible; display: block; }
.mascot .body { transform-origin: 60px 130px; animation: bob 2.8s ease-in-out infinite; }
.mascot .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.mascot .eyes-happy, .mascot .eyes-closed, .mascot .mouth-big, .mascot .mouth-sad, .mascot .mouth-o, .mascot .tear, .mascot .brows, .mascot .zz, .mascot .sparks, .mascot .sweat { display: none; }
.mascot .arm { transform-box: fill-box; transition: transform 0.35s cubic-bezier(.3, 1.6, .5, 1); }
.mascot .arm.l { transform-origin: 90% 10%; }
.mascot .arm.r { transform-origin: 10% 10%; }
.mascot[data-state="happy"] .eyes-open, .mascot[data-state="party"] .eyes-open { display: none; }
.mascot[data-state="happy"] .eyes-happy, .mascot[data-state="party"] .eyes-happy { display: inline; }
.mascot[data-state="happy"] .mouth-smile, .mascot[data-state="party"] .mouth-smile { display: none; }
.mascot[data-state="happy"] .mouth-big, .mascot[data-state="party"] .mouth-big, .mascot[data-state="party"] .sparks { display: inline; }
.mascot[data-state="happy"] .body { animation: hop 0.5s cubic-bezier(.3, .7, .4, 1) 2; }
.mascot[data-state="happy"] .arm.l { transform: rotate(60deg); }
.mascot[data-state="party"] .body { animation: party 0.9s ease-in-out infinite; }
.mascot[data-state="party"] .arm.l { transform: rotate(125deg); }
.mascot[data-state="party"] .arm.r { transform: rotate(-125deg); }
.mascot[data-state="party"] .sparks { animation: twinkle 0.9s ease-in-out infinite; transform-origin: 60px 60px; }
.mascot[data-state="sad"] .mouth-smile, .mascot[data-state="worried"] .mouth-smile { display: none; }
.mascot[data-state="sad"] .mouth-sad, .mascot[data-state="sad"] .tear, .mascot[data-state="sad"] .brows { display: inline; }
.mascot[data-state="sad"] .body { animation: droop 0.5s ease-out forwards, shake 0.4s ease-in-out; }
.mascot[data-state="sad"] .arm.l { transform: rotate(-12deg); }
.mascot[data-state="sad"] .arm.r { transform: rotate(12deg); }
.mascot[data-state="worried"] .mouth-o, .mascot[data-state="worried"] .brows, .mascot[data-state="worried"] .sweat { display: inline; }
.mascot[data-state="sleep"] .eyes-open, .mascot[data-state="sleep"] .mouth-smile { display: none; }
.mascot[data-state="sleep"] .eyes-closed, .mascot[data-state="sleep"] .mouth-o, .mascot[data-state="sleep"] .zz { display: inline; }
.mascot[data-state="sleep"] .body { animation: breathe 3.5s ease-in-out infinite; }
.mascot[data-state="sleep"] .zz { animation: zz 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
@keyframes hop { 0% { transform: none; } 30% { transform: translateY(-18px) scale(0.94, 1.06); } 65% { transform: translateY(0) scale(1.1, 0.9); } 100% { transform: none; } }
@keyframes party { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-15px) rotate(-7deg); } 50% { transform: translateY(0) scale(1.06, 0.94); } 75% { transform: translateY(-15px) rotate(7deg); } }
@keyframes droop { to { transform: translateY(4px) scale(1.05, 0.93); } }
@keyframes shake { 0%, 100% { translate: 0; } 20% { translate: -6px; } 40% { translate: 6px; } 60% { translate: -4px; } 80% { translate: 3px; } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, 0.97); } }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.08); } }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -8px); } }

.bubble { position: relative; background: var(--surface); border-radius: 1.2rem; padding: 0.75rem 0.95rem; font-weight: 800; min-width: 0; box-shadow: 0 3px 0 var(--line), 0 8px 20px color-mix(in srgb, var(--ink) 7%, transparent); }
.bubble::before { content: ""; position: absolute; left: -7px; top: 1.15rem; width: 16px; height: 16px; background: var(--surface); transform: rotate(45deg); border-radius: 3px; }
.pop { animation: pop 0.3s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(0.8); opacity: 0.3; } to { transform: none; opacity: 1; } }

/* Inicio */
.home-body { display: grid; gap: 1.1rem; padding-block: 0.6rem 3rem; }
.hero {
  position: relative; overflow: hidden; border-radius: 1.6rem; padding: 1rem 1rem 1.1rem; color: #fff; display: grid; gap: 0.9rem;
  background: radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.22), transparent 38%), linear-gradient(150deg, color-mix(in srgb, var(--mint) 85%, var(--sky)), color-mix(in srgb, var(--mint) 70%, #04382a));
  box-shadow: 0 7px 0 color-mix(in srgb, var(--mint) 55%, #000), 0 16px 30px color-mix(in srgb, var(--mint) 25%, transparent);
}
.hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); }
.hero-top { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); gap: 0.8rem; align-items: center; position: relative; z-index: 1; }
.hero .m { width: 6.2rem; height: 7.2rem; cursor: pointer; background: none; border: 0; padding: 0; }
.hero .bubble { color: var(--ink); }
.goal { display: grid; gap: 0.35rem; position: relative; z-index: 1; }
.goal-row { display: flex; justify-content: space-between; gap: 1rem; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.goal-row .label { color: rgba(255, 255, 255, 0.85); }
.goal-track { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: center; }
.meter { position: relative; height: 1.05rem; background: rgba(0, 0, 0, 0.22); border-radius: 1rem; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #ffe07a, var(--sun)); border-radius: 1rem; transition: width 0.8s cubic-bezier(.2, .8, .2, 1); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.45); }
.chest { width: 2.6rem; height: 2.6rem; padding: 0; border: 0; background: none; color: #ffe07a; cursor: default; display: grid; place-items: center; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.25)); }
.chest .ico { width: 2.3rem; height: 2.3rem; }
.chest.ready { cursor: pointer; animation: wiggle 1.6s ease-in-out infinite; filter: drop-shadow(0 0 10px #ffe07a) drop-shadow(0 2px 0 rgba(0, 0, 0, 0.25)); }
.chest.opened { color: rgba(255, 255, 255, 0.85); }
@keyframes wiggle { 0%, 60%, 100% { transform: rotate(0) scale(1); } 66% { transform: rotate(-12deg) scale(1.12); } 74% { transform: rotate(10deg) scale(1.12); } 82% { transform: rotate(-6deg) scale(1.08); } 90% { transform: rotate(0) scale(1); } }
.goal-row .open-hint { color: #fff3bf; }

/* Cofre a pantalla completa */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: color-mix(in srgb, #06201a 72%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fadeIn 0.25s ease-out; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box { width: 100%; max-width: 22rem; display: grid; justify-items: center; gap: 0.9rem; text-align: center; color: #fff; }
.modal-box h2 { font-size: 2rem; color: #ffe07a; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.modal-box p { color: rgba(255, 255, 255, 0.85); }
.bigchest { width: 15rem; max-width: 100%; aspect-ratio: 200 / 180; border: 0; background: none; padding: 0; cursor: pointer; animation: wiggle 1.6s ease-in-out infinite; }
.bigchest svg { width: 100%; height: 100%; overflow: visible; }
.bigchest .lid { transform-box: view-box; transform-origin: 30px 82px; transition: transform 0.55s cubic-bezier(.3, 1.8, .5, 1); }
.bigchest .rays { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(0.3); transition: opacity 0.4s, transform 0.6s cubic-bezier(.3, 1.6, .5, 1); }
.bigchest .glow { opacity: 0; transition: opacity 0.3s; }
.bigchest.shaking { animation: shakeChest 0.7s ease-in-out; }
.bigchest.open { animation: none; cursor: default; }
.bigchest.open .lid { transform: translate(-6px, -46px) rotate(-18deg); }
.bigchest.open .rays { opacity: 1; transform: scale(1); animation: spin 9s linear infinite; }
.bigchest.open .glow { opacity: 1; }
@keyframes shakeChest { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.03); } 30% { transform: rotate(6deg) scale(1.05); } 45% { transform: rotate(-8deg) scale(1.07); } 60% { transform: rotate(8deg) scale(1.08); } 80% { transform: scale(1.12, 0.92); } }
@keyframes spin { to { rotate: 360deg; } }
.rewards { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; width: 100%; }
.reward { display: grid; justify-items: center; gap: 0.2rem; padding: 0.8rem 0.5rem; border-radius: 1.1rem; background: var(--surface); color: var(--ink); box-shadow: 0 4px 0 var(--line); animation: pop 0.45s cubic-bezier(.3, 1.8, .5, 1) both; }
.reward:nth-child(2) { animation-delay: 0.15s; }
.reward .ico { width: 2.2rem; height: 2.2rem; }
.reward b { font-family: var(--font-display); font-size: 1.35rem; line-height: 1; }
.reward span { font-size: 0.8rem; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; position: relative; z-index: 1; }
.day { display: grid; justify-items: center; gap: 0.15rem; font-size: 0.72rem; font-weight: 900; color: rgba(255, 255, 255, 0.75); }
.day .f { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: rgba(0, 0, 0, 0.16); color: rgba(255, 255, 255, 0.3); }
.day .f .ico { width: 1.15rem; height: 1.15rem; }
.day.lit .f { background: linear-gradient(160deg, #ffd166, var(--tang)); color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2); }
.day.today { color: #fff; }
.day.today .f { outline: 2px solid rgba(255, 255, 255, 0.8); outline-offset: 2px; }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.qcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.6rem; align-items: center; text-align: left; border: 0; cursor: pointer; background: var(--surface); border-radius: 1.2rem; padding: 0.75rem; box-shadow: 0 4px 0 var(--line); transition: transform 0.08s; }
.qcard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.qcard .qi { width: 2.6rem; height: 2.6rem; border-radius: 0.9rem; display: grid; place-items: center; color: #fff; background: var(--c); box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 65%, #000); }
.qcard b { display: block; font-family: var(--font-display); font-size: 1.02rem; line-height: 1.1; }
.qcard span { font-size: 0.78rem; color: var(--muted); }

.unit { display: grid; gap: 0.6rem; padding-top: 0.6rem; }
.banner {
  --c: var(--mint); position: relative; overflow: hidden; border-radius: 1.4rem; padding: 1rem 1.1rem; color: #fff; display: grid; gap: 0.45rem;
  background: radial-gradient(circle at 90% 10%, rgba(255, 255, 255, 0.25), transparent 40%), linear-gradient(150deg, color-mix(in srgb, var(--c) 88%, #fff), var(--c));
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 62%, #000);
}
.banner .label { color: rgba(255, 255, 255, 0.85); }
.banner h2 { font-size: 1.45rem; max-width: 80%; text-shadow: 0 2px 0 color-mix(in srgb, var(--c) 60%, #000); }
.banner .big { position: absolute; right: -10px; bottom: -14px; width: 6.5rem; height: 6.5rem; opacity: 0.22; transform: rotate(-12deg); }
.banner .prog { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 900; max-width: 75%; }
.banner .prog .bar { flex: 1; height: 0.5rem; border-radius: 1rem; background: rgba(0, 0, 0, 0.2); overflow: hidden; }
.banner .prog .bar i { display: block; height: 100%; background: #fff; border-radius: 1rem; }
.banner .prog .ico { width: 1rem; height: 1rem; color: #ffe07a; }

.map { position: relative; margin-inline: auto; width: 100%; max-width: 20rem; overflow: hidden; }
.map svg.road { position: absolute; left: 50%; top: 0; translate: -50% 0; overflow: visible; pointer-events: none; }
.node {
  --c: var(--mint); position: absolute; width: 4.7rem; height: 4.5rem; translate: -50% 0; border: 0; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.55), transparent 32%), linear-gradient(180deg, color-mix(in srgb, var(--c) 80%, #fff), var(--c));
  box-shadow: 0 8px 0 color-mix(in srgb, var(--c) 62%, #000), 0 12px 18px color-mix(in srgb, var(--c) 30%, transparent), inset 0 -4px 0 color-mix(in srgb, var(--c) 80%, #000);
  transition: transform 0.1s, box-shadow 0.1s;
}
.node .ico { width: 2.1rem; height: 2.1rem; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.18)); }
.node:active:not(.locked) { transform: translateY(6px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 62%, #000), inset 0 -4px 0 color-mix(in srgb, var(--c) 80%, #000); }
.node.done { --c: var(--sun) !important; }
.node.locked { --c: var(--line) !important; color: var(--muted); cursor: not-allowed; box-shadow: 0 7px 0 color-mix(in srgb, var(--line) 75%, #000); background: var(--line); }
.node.review { width: 5.4rem; height: 5.1rem; }
.node.current { animation: nodeBounce 2.2s ease-in-out infinite; }
.node.current::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 5px solid color-mix(in srgb, var(--c) 45%, transparent); animation: ring 1.8s ease-out infinite; }

.combo { display: inline-flex; align-items: center; gap: 0.2rem; font-family: var(--font-display); font-weight: 800; color: #fff; background: linear-gradient(160deg, #ffd166, var(--tang)); border-radius: 2rem; padding: 0.15rem 0.7rem 0.1rem 0.45rem; box-shadow: 0 3px 0 color-mix(in srgb, var(--tang) 65%, #000); font-size: 1rem; }

}

.sheet.bad { background: var(--bad-bg); animation: sheetUp 0.35s cubic-bezier(.2, 1.3, .4, 1); }

<div id="app">
  <!-- INICIO -->
  <section id="home" class="screen">
    <header class="topbar">
      <div class="wrap">
        <div class="brand"><span class="logo"><svg class="ico"><use href="#i-flame"/></svg></span><span>Plaza en Racha<small>Temario común SAS</small></span></div>
        <div class="hud">
          <span class="pill flame" id="hStreak" title="Racha de días"><svg class="ico"><use href="#i-flame"/></svg><span>0</span></span>
          <span class="pill gold" id="hXp" title="Puntos de experiencia"><svg class="ico"><use href="#i-bolt"/></svg><span>0</span></span>
          <span class="pill heart" id="hHearts" title="Vidas"><svg class="ico"><use href="#i-heart"/></svg><span>5</span></span>
          <button class="pill btnlike" id="soundBtn" aria-label="Sonido"><svg class="ico"><use href="#i-sound"/></svg></button>
        </div>
      </div>
    </header>

    <div class="wrap home-body">
      <div class="hero">
        <div class="hero-top">
          <button class="m" id="homeMascot" aria-label="Pildi, la mascota"><svg class="mascot" data-mascot id="hMascot" data-state="idle" viewBox="0 0 120 140"></svg></button>
          <div class="bubble" id="homeBubble">¡Hola! Soy Pildi. Vamos a por tu plaza, lección a lección.</div>
        </div>
        <div class="goal">
          <div class="goal-row"><span class="label">Meta diaria</span><span id="goalTxt">0 / 30 XP</span></div>
          <div class="goal-track">
            <div class="meter"><i id="goalBar" style="width:0%"></i></div>
            <button class="chest" id="goalChest" aria-label="Cofre de la meta diaria"><svg class="ico"><use href="#i-chest"/></svg></button>
          </div>
        </div>
        <div class="week" id="week" aria-label="Tu semana"></div>
      </div>

      <div class="quick">
        <button class="qcard" id="practiceBtn" style="--c:var(--violet)"><span class="qi"><svg class="ico"><use href="#i-dumbbell"/></svg></span><span><b>Repasar</b><span id="practiceSub">Sin gastar vidas</span></span></button>
        <button class="qcard" id="rankBtn" style="--c:var(--sun)"><span class="qi"><svg class="ico"><use href="#i-podium"/></svg></span><span><b>Ranking</b><span id="rankSub">Compite cada semana</span></span></button>
      </div>

      <div id="units"></div>
    </div>
  </section>

  <!-- LECCIÓN -->
  <section id="lesson" hidden>
    <div class="wrap lhead">
      <button class="x" id="quitBtn" aria-label="Salir de la lección"><svg class="ico"><use href="#i-x"/></svg></button>
      <div class="lbar" id="lBarBox"><i id="lBar" style="width:0%"></i></div>
      <span class="pill heart lhearts" id="lHearts"><svg class="ico"><use href="#i-heart"/></svg><span>5</span></span>
    </div>
    <div class="wrap lbody" id="lbody">
      <div class="coach">
        <div class="m"><svg class="mascot" data-mascot id="lMascot" data-state="idle" viewBox="0 0 120 140"></svg></div>
        <div class="bubble" id="lBubble">¡Vamos!</div>
      </div>
      <div class="kindrow">
        <h2 class="kind" id="kind"></h2>
        <span class="combo" id="combo" hidden></span>
      </div>
      <div id="ex"></div>
    </div>
    <div class="sheet" id="sheet">
      <div class="wrap">
        <div class="fbrow" id="fb" hidden>
          <span class="fbicon" id="fbIcon"></span>
          <div><div class="fbt" id="fbt"></div><p class="fbd" id="fbd"></p></div>
        </div>
        <button class="btn" id="checkBtn" disabled>Comprobar</button>
      </div>
    </div>
  </section>

  <!-- RANKING -->
  <section id="rank" hidden>
    <div class="wrap">
      <div class="rank-head">
        <button class="x" id="rankBack" aria-label="Volver"><svg class="ico"><use href="#i-x"/></svg></button>
        <h1>Ranking</h1>
      </div>
      <div class="rank-hero">
        <div class="m"><svg class="mascot" data-mascot id="rMascot" data-state="idle" viewBox="0 0 120 140"></svg></div>
        <div class="bubble" id="rBubble">Cargando el ranking…</div>
      </div>
      <form class="nick" id="nickForm" hidden>
        <input id="nickInput" maxlength="24" placeholder="Tu nombre en el ranking" aria-label="Tu nombre en el ranking" autocomplete="nickname">
        <button class="btn" type="submit">Guardar</button>
      </form>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabWeek" aria-selected="true">Esta semana</button>
        <button class="tab" role="tab" id="tabAll" aria-selected="false">Total</button>
      </div>
      <div class="board" id="board"></div>
      <p class="rank-note" id="rankNote"></p>
    </div>
  </section>

  <!-- FIN -->
  <section id="end" hidden>
    <div class="wrap end" id="endBox">
      <div class="stars3" id="eStars"></div>
      <div class="m"><svg class="mascot" data-mascot id="eMascot" data-state="party" viewBox="0 0 120 140"></svg></div>
      <h1 id="eTitle">¡Lección completada!</h1>
      <p id="eText"></p>
      <div class="streakcard" id="eStreak" hidden><svg class="ico"><use href="#i-flame"/></svg><div><b id="eStreakT"></b><span id="eStreakS"></span></div></div>
      <div class="tiles" id="eTiles"></div>
      <div class="actions" id="eActions"></div>
    </div>
  </section>
</div>
<div class="modal" id="chestModal" hidden role="dialog" aria-modal="true" aria-labelledby="chestTitle">
  <div class="modal-box">
    <h2 id="chestTitle">¡Meta diaria cumplida!</h2>
    <p id="chestText">Toca el cofre para abrirlo.</p>
    <button class="bigchest" id="bigChest" aria-label="Abrir el cofre">
      <svg viewBox="0 0 200 180" aria-hidden="true">
        <g class="rays" fill="#ffe07a" opacity=".55">
          <path d="M100 80 L88 -40 L112 -40Z"/><path d="M100 80 L160 -25 L178 -8Z"/><path d="M100 80 L220 40 L222 64Z"/><path d="M100 80 L-20 40 L-22 64Z"/><path d="M100 80 L40 -25 L22 -8Z"/>
          <path d="M100 80 L200 -5 L210 18Z" opacity=".6"/><path d="M100 80 L0 -5 L-10 18Z" opacity=".6"/>
        </g>
        <ellipse cx="100" cy="172" rx="70" ry="7" fill="#000" opacity=".25"/>
        <ellipse class="glow" cx="100" cy="84" rx="64" ry="14" fill="#fff6c2"/>
        <g stroke="#4f2a0e" stroke-width="4" stroke-linejoin="round">
          <rect x="30" y="82" width="140" height="84" rx="10" fill="#d0802f"/>
          <path d="M30 104 h140" stroke-width="3" opacity=".35"/>
          <rect x="52" y="82" width="14" height="84" fill="#ffbb26"/>
          <rect x="134" y="82" width="14" height="84" fill="#ffbb26"/>
          <rect x="86" y="80" width="28" height="32" rx="5" fill="#ffd75e"/>
          <circle cx="100" cy="93" r="4" fill="#4f2a0e" stroke="none"/><path d="M100 95 v8" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g class="lid" stroke="#4f2a0e" stroke-width="4" stroke-linejoin="round">
          <path d="M30 82 V64 a70 34 0 0 1 140 0 V82 Z" fill="#e8913d"/>
          <path d="M52 82 V46 q7 -4 14 -6 V82Z M134 82 V40 q7 2 14 6 V82Z" fill="#ffbb26"/>
          <path d="M44 56 q20 -16 46 -18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".45"/>
        </g>
      </svg>
    </button>
    <div class="rewards" id="rewards" hidden>
      <div class="reward"><svg class="ico" style="color:var(--sun)"><use href="#i-bolt"/></svg><b>+15 XP</b><span>de regalo</span></div>
      <div class="reward"><svg class="ico" style="color:var(--coral)"><use href="#i-heart"/></svg><b>Vidas llenas</b><span>5 de 5</span></div>
    </div>
    <button class="btn" id="chestBtn" hidden style="--c:var(--sun)">Recoger</button>
  </div>
</div>
<canvas id="fx"></canvas>

<script src="preguntas.js"></script>
<script src="app.js"></script>
